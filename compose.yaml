# Pi-NOMAD: offline-first knowledge server for Raspberry Pi 5 (arm64)
# Modeled on Project NOMAD, minus the AI stack.
# Every service is a plain container; the Command Center at :80 links to all of them.

name: pi-nomad

x-defaults: &defaults
  restart: unless-stopped
  networks: [nomad]
  # Cap each app's log at 3 files of 5 MB. Without this the logs grow without limit
  # and keep writing to the SD card.
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:
  # ---- Front door: Command Center dashboard (apps, service status, storage) ----
  command-center:
    <<: *defaults
    build: ./command-center
    ports: ["80:80"]
    environment:
      NOMAD_DATA: /data
      COMPOSE_PROJECT: pi-nomad
      CONFIG_DIR: /config
      POWER_DIR: /power
    volumes:
      - ${NOMAD_DATA:-/srv/nomad}:/data:ro
      # Only these two folders are writable: the ZIM and map managers download into them.
      # Paths match what the kiwix container sees (/data/zim/...), so library.xml stays valid.
      - ${NOMAD_DATA:-/srv/nomad}/zim:/data/zim
      - ${NOMAD_DATA:-/srv/nomad}/maps:/data/maps
      # Admin PIN hash. A named volume, kept out of /srv/nomad so the Files app cannot touch it.
      - nomad-config:/config
      # Use the Pi's own clock setting, so backup folders and log lines show local time, not UTC.
      - /etc/localtime:/etc/localtime:ro
      # Shut down / restart: the app writes a one-word request here and a helper that
      # install.sh puts on the Pi acts on it. The app gets no other control over the Pi.
      - /var/lib/pi-nomad/power:/power
      # USB drives for the Backup page. The Pi's desktop mounts a plugged-in drive under /media;
      # "rslave" makes drives plugged in later show up inside the container too.
      - type: bind
        source: /media
        target: /media
        bind: { propagation: rslave }
      # Docker's socket: status lights, and start / stop / restart of the other apps
      # (services.py allows nothing else). ":ro" does not limit what can be asked over a socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---- Information Library (Wikipedia, medical, survival ZIMs) ----
  kiwix:
    <<: *defaults
    # Pinned on purpose: libkiwix's unreleased main branch changes the library.xml format
    # (to an Atom/OPDS feed), so a surprise ":latest" upgrade could break the Command Center's
    # library writer. 3.8.2 uses libkiwix 14.2.1 (<library><book> format) and ships arm64.
    image: ghcr.io/kiwix/kiwix-serve:3.8.2
    ports: ["8080:8080"]
    volumes:
      - ${NOMAD_DATA:-/srv/nomad}/zim:/data/zim:ro
    # The image's start script adds --port itself (default 8080).
    # library.xml is watched, so adding a ZIM never needs a restart.
    command: ["--library", "--monitorLibrary", "--threads=4", "/data/zim/library.xml"]

  # ---- Notes (markdown, no auth, like NOMAD) ----
  flatnotes:
    <<: *defaults
    image: dullage/flatnotes:v5        # major version, not "latest": no surprise jump to a v6
    ports: ["8081:8080"]
    environment:
      FLATNOTES_AUTH_TYPE: none
    volumes:
      - ${NOMAD_DATA:-/srv/nomad}/notes:/data

  # ---- Data tools: encode/decode/hash/crypto ----
  cyberchef:
    <<: *defaults
    # Major version 11: its nginx listens on 8080. Version 10 listened on 80, so the port below
    # must be re-checked whenever this number changes.
    image: ghcr.io/gchq/cyberchef:11
    ports: ["8082:8080"]

  # ---- File manager for the data drive (ZIMs, PDFs, maps) ----
  files:
    <<: *defaults
    # Dufs: one small binary, no database, no login (like the rest of the stack).
    # Runs as root, which it needs because /srv/nomad and all downloads are root-owned.
    image: sigoden/dufs:v0.47.0
    # --hidden only trims the listing: the app's own bookkeeping files stay out of the way.
    command: ["--allow-all", "--hidden", "library.xml,library.xml.tmp,*.part,.flatnotes,*.places.db,*.places.db.tmp,kolibri,mesh", "/srv"]
    ports: ["8083:5000"]
    volumes:
      - ${NOMAD_DATA:-/srv/nomad}:/srv

  # ---- Offline maps (Protomaps) ----
  # No separate service: the Command Center serves the viewer at /maps/ and the
  # .pmtiles files (with Range support) from /maps-data/.

  # ---- Education (Kolibri: Khan Academy and other offline lessons) ----
  kolibri:
    <<: *defaults
    # No current upstream image exists, so ./kolibri builds one from the Python package (pinned there).
    build: ./kolibri
    # Both ports must keep their numbers: Kolibri tells the browser to fetch interactive lessons
    # from the second one. It has its own accounts; the first visit runs its setup.
    ports: ["8085:8085", "8086:8086"]
    volumes:
      - ${NOMAD_DATA:-/srv/nomad}/kolibri:/kolibri

  # ---- Mesh radio (Meshtastic): text other radios with no cell service or internet ----
  # Two parts. mesh-bridge passes the USB radio to the network; meshmonitor is the web page.
  mesh-bridge:
    <<: *defaults
    image: ghcr.io/yeraze/meshtastic-serial-bridge:1.1.4
    # The whole /dev folder is shared (not one device), so the radio can be unplugged and plugged
    # back in, or be absent at start-up, without the container failing. The two rules are the only
    # device access it gets: USB serial ports (166 = ttyACM, 188 = ttyUSB).
    volumes:
      - /dev:/dev
    device_cgroup_rules: ["c 166:* rmw", "c 188:* rmw"]
    environment:
      # install.sh adds a rule that gives any plugged-in Meshtastic-style USB radio this fixed name.
      SERIAL_DEVICE: ${MESH_RADIO:-/dev/pi-nomad-radio}
      DEVICE_TIMEOUT: "60"            # no radio: it waits, gives up, and Docker starts it again
    tmpfs: ["/tmp:size=10M"]

  meshmonitor:
    <<: *defaults
    image: ghcr.io/yeraze/meshmonitor:4.17.3
    ports: ["8087:3001"]
    depends_on: [mesh-bridge]
    volumes:
      - ${NOMAD_DATA:-/srv/nomad}/mesh:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs: ["/data/logs:size=10M", "/tmp:size=50M"]
    environment:
      NODE_ENV: production
      MESHTASTIC_NODE_IP: mesh-bridge
      MESHTASTIC_NODE_PORT: "4403"
      ACCESS_LOG_ENABLED: "false"
      # The deck is reached by several addresses (home Wi-Fi, Ethernet, hotspot, name), all plain
      # HTTP. Without these three, any address but localhost gets an error and logins do not stick.
      ALLOWED_ORIGINS: "*"
      COOKIE_SECURE: "false"
      IFRAME_ALLOWED_ORIGINS: "*"     # lets it show under the dashboard's top bar
    # It has its own login (first run: admin / changeme), separate from the deck's admin PIN.

networks:
  nomad:

volumes:
  nomad-config:
