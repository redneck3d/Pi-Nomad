<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi-Nomad Command Center</title>
<meta name="theme-color" content="#0f1624">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="hero contours">
  <div class="hero-in">
    <img class="logo" src="/img/logo.png" alt="Pi-Nomad" width="401" height="380">
    <div>
      <p class="eyebrow">Command Center</p>
      <h1>Knowledge that never goes offline.</h1>
      <p class="health" id="health"><i></i><span>Checking services&hellip;</span></p>
      <dl class="stats">
        <div><dt>Free space</dt><dd id="statFree">&ndash;</dd></div>
        <div><dt>Libraries</dt><dd id="statZims">&ndash;</dd></div>
        <div><dt>Map regions</dt><dd id="statMaps">&ndash;</dd></div>
      </dl>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="admin"></div>
  <h3>Explore</h3>
  <div class="tiles" id="tiles"></div>

  <h3>Manage and tools</h3>
  <div class="tools" id="tools"></div>

  <h3>System</h3>
  <div id="warn"></div>
  <div class="sys" id="system"><span class="empty">Loading&hellip;</span></div>

  <div class="split">
    <section>
      <h3>Storage</h3>
      <div class="panel" id="storage"><span class="empty">Loading&hellip;</span></div>
    </section>
    <section>
      <h3>Your libraries</h3>
      <div class="panel" id="zims"><span class="empty">Loading&hellip;</span></div>
    </section>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/shared.js"></script>
<script>
const ICONS = {
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  map:'<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
  note:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  term:'<path d="M4 17l6-6-6-6M12 19h8"/>',
  shelf:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
};
// Add or remove apps here. `svc` is the compose service name used for the status light.
// `main: true` puts the app in the large Explore row.
const APPS = [
  { svc:"kiwix",          main:true, tone:"teal",  ico:"book",     name:"Information Library", desc:"Offline Wikipedia, medical references and survival guides.", port:8080 },
  { svc:"command-center", main:true, tone:"green", ico:"map",      name:"Maps",                desc:"Find your way with the regions saved on this device.",      href:"/maps/" },
  { svc:"command-center", main:true, tone:"rust",  ico:"shelf",    name:"Bookshelf",           desc:"Read your own EPUB and PDF books.",                         href:"/books/" },
  { svc:"flatnotes",      main:true, tone:"amber", ico:"note",     name:"Notes",               desc:"Write and search your own markdown notes.",                 port:8081 },
  { svc:"command-center", tone:"teal",  ico:"download", name:"Content Manager", desc:"Download new libraries",        href:"/zim.html" },
  { svc:"command-center", tone:"green", ico:"pin",      name:"Map regions",     desc:"Save a map area for offline use", href:"/maps/manage.html" },
  { svc:"cyberchef",      tone:"rust",  ico:"term",     name:"Data Tools",      desc:"Encode, decode, hash, encrypt",  port:8082 },
  { svc:"files",          tone:"amber", ico:"folder",   name:"Files",           desc:"Browse and upload to the drive", port:8083 },
  { svc:"command-center", tone:"teal",  ico:"save",     name:"Backup",          desc:"Copy notes and books to USB",    href:"/backup.html" },
];
const host = location.hostname;
const COLORS = { zim:"#35ad9e", maps:"#70ad58", notes:"#eaa640", books:"#c98a5a", other:"#6d7c92" };
const LABELS = { zim:"Libraries", maps:"Maps", notes:"Notes", books:"Books", other:"System" };
const icon = n => `<span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg></span>`;
const stateHtml = i => `<span class="state" id="state${i}"><i></i><span>Checking</span></span>`;

// Built once and only updated afterwards, so a refresh can't disturb hover or keyboard focus.
function buildApps() {
  const url = a => a.href || `http://${host}:${a.port}`;
  $("tiles").innerHTML = APPS.map((a, i) => !a.main ? "" : `<a class="tile tone-${a.tone}" id="app${i}" href="${url(a)}">
    ${icon(a.ico)}<h2>${a.name}</h2><p>${a.desc}</p>${stateHtml(i)}</a>`).join("");
  $("tools").innerHTML = APPS.map((a, i) => a.main ? "" : `<a class="tool tone-${a.tone}" id="app${i}" href="${url(a)}">
    ${icon(a.ico)}<div class="txt"><h2>${a.name}</h2><p>${a.desc}</p></div>${stateHtml(i)}</a>`).join("");
}

function renderApps(services) {
  const known = Object.keys(services).length > 0;
  APPS.forEach((a, i) => {
    const st = services[a.svc], up = st === "running";
    $("app" + i).classList.toggle("off", known && !up);
    const el = $("state" + i);
    el.className = "state " + (!known ? "" : up ? "up" : "down");
    el.lastChild.textContent = !known ? "Unknown" : up ? "Running" : (st ? "Stopped" : "Not installed");
  });
  const all = Object.values(services), running = all.filter(s => s === "running").length;
  const h = $("health");
  h.className = "health " + (!known ? "" : running === all.length ? "up" : "warn");
  h.lastChild.textContent = !known ? "Service status unavailable"
    : running === all.length ? `All ${all.length} services running` : `${running} of ${all.length} services running`;
}

function renderStorage(s) {
  const el = $("storage");
  if (!s) { el.innerHTML = '<span class="empty">Data drive not found.</span>'; $("statFree").textContent = "–"; return; }
  $("statFree").textContent = fmt(s.free);
  const known = Object.values(s.folders).reduce((a, b) => a + b, 0);
  const parts = Object.entries(s.folders);
  parts.push(["other", Math.max(0, s.used - known)]);
  el.innerHTML = `<div><span class="big">${fmt(s.free)}</span> <span class="empty">free of ${fmt(s.total)}</span></div>
    <div class="meter">${parts.filter(([, v]) => v > 0).map(([k, v]) => `<i title="${LABELS[k]}" style="width:${v / s.total * 100}%;background:${COLORS[k]}"></i>`).join("")}</div>
    <div class="legend">${parts.map(([k, v]) => `<span style="--c:${COLORS[k]}">${LABELS[k]} ${fmt(v)}</span>`).join("")}</div>`;
}

function renderZims(list) {
  $("statZims").textContent = list.length;
  const page = f => `http://${host}:8080/content/${encodeURIComponent(f.replace(/\.zim$/, ""))}`;
  $("zims").innerHTML = list.length
    ? `<table>${list.map(z => `<tr><td><a href="${page(z.name)}">${esc(z.name.replace(/\.zim$/, ""))}</a></td><td class="r">${fmt(z.size)}</td></tr>`).join("")}</table>`
    : '<span class="empty">No libraries yet. Open the <a href="/zim.html">Content Manager</a> to download some.</span>';
}

function upfmt(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function stat(label, value, note, pct, cls) {
  return `<div class="stat"><small>${label}</small><b>${value}</b>${pct == null ? "" :
    `<div class="gauge"><i class="${cls || ""}" style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`}<span>${note || ""}</span></div>`;
}
function renderSystem(s) {
  const lvl = p => p >= 90 ? "hot" : p >= 75 ? "warm" : "";
  const cards = [];
  if (s.temp_c != null) cards.push(stat("Temperature", s.temp_c.toFixed(0) + " \u00b0C",
    s.fan_rpm != null ? "Fan " + s.fan_rpm + " rpm" : "", s.temp_c / 85 * 100, s.temp_c >= 80 ? "hot" : s.temp_c >= 70 ? "warm" : ""));
  if (s.cpu.percent != null) cards.push(stat("Processor", s.cpu.percent.toFixed(0) + "%",
    (s.cpu.cores ? s.cpu.cores + " cores" : "") + (s.cpu.load ? " \u00b7 load " + s.cpu.load[0].toFixed(2) : ""), s.cpu.percent, lvl(s.cpu.percent)));
  if (s.memory) cards.push(stat("Memory", s.memory.used_percent.toFixed(0) + "%",
    fmt(s.memory.available) + " free of " + fmt(s.memory.total), s.memory.used_percent, lvl(s.memory.used_percent)));
  if (s.uptime_s != null) cards.push(stat("Running for", upfmt(s.uptime_s), ""));
  if (s.disk) cards.push(stat("Written to drive", fmt(s.disk.written), "since startup \u00b7 " + esc(s.disk.device)));
  const off = Math.round((Date.now() / 1000 - s.time) / 60);
  cards.push(stat("Deck clock", new Date(s.time * 1000).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }),
    Math.abs(off) >= 2 ? `${Math.abs(off)} min ${off > 0 ? "behind" : "ahead of"} this device` : "matches this device"));
  $("system").innerHTML = cards.join("");
  $("warn").innerHTML = s.warnings.map(w => `<div class="warnbox">${esc(w)}</div>`).join("");
}
async function refreshSystem() {
  try { renderSystem(await api("/api/system")); }
  catch (e) { $("system").innerHTML = '<span class="empty">System readings unavailable.</span>'; }
}

async function refresh() {
  try {
    const d = await api("/api/status");
    renderApps(d.services); renderStorage(d.storage); renderZims(d.zims);
    $("statMaps").textContent = (await api("/api/maps/list")).length;
  } catch (e) { renderApps({}); }
}
Admin.mount($("admin"));
buildApps(); refresh(); setInterval(refresh, 10000);
refreshSystem(); setInterval(refreshSystem, 5000);
</script>
</body>
</html>
