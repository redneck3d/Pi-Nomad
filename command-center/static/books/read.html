<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader - Pi-Nomad</title><meta name="theme-color" content="#141c2d">
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
  :root { color-scheme: dark; --bg:#141c2d; --panel:#1b2639; --line:#32435e; --txt:#f0efe6; --mut:#a9b4c3; --acc:#35ad9e; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  #bar { display:flex; gap:.5rem; align-items:center; padding:.5rem .7rem; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  #bar a { color:var(--acc); text-decoration:none; font-size:.9rem; white-space:nowrap; }
  #title { font-weight:600; font-size:.95rem; flex:1 1 8rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select, button { font:inherit; font-size:.9rem; color:var(--txt); background:#0f1624; border:1px solid var(--line); border-radius:10px; padding:.4rem .7rem; min-height:40px; }
  select { max-width:16rem; flex:1 1 8rem; min-width:0; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); } button:disabled { opacity:.4; cursor:default; }
  iframe { flex:1; width:100%; border:0; background:#fff; }
  #msg { padding:2rem; color:var(--mut); }
</style></head>
<body>
<div id="bar">
  <a href="/books/">&larr; Bookshelf</a>
  <span id="title"></span>
  <select id="chap" aria-label="Chapter"></select>
  <button id="prev" title="Previous section">&lsaquo; Prev</button>
  <button id="next" title="Next section">Next &rsaquo;</button>
  <button id="smaller" title="Smaller text">A&minus;</button>
  <button id="bigger" title="Larger text">A+</button>
  <button id="theme" title="Light, sepia or dark page">Theme</button>
</div>
<iframe id="page" title="Book page"></iframe>
<div id="msg" style="display:none"></div>
<script>
const $ = id => document.getElementById(id);
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const book = new URLSearchParams(location.search).get("book") || "";
const base = "/books-read/" + enc(book) + "/";
const THEMES = { light:["#ffffff","#1b1f24","#0b5cad"], sepia:["#f4ecd8","#3b2f20","#7a4b12"], dark:["#141c2d","#e4e6e0","#35ad9e"] };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let spine = [], idx = 0, size = store.get("reader.size", 110), theme = store.get("reader.theme", "dark");
if (!THEMES[theme]) theme = "dark";

function go(i) {
  idx = Math.max(0, Math.min(spine.length - 1, i));
  $("page").src = base + enc(spine[idx].href);
}
function restyle() {            // the book's own pages get our text size and colours
  const doc = $("page").contentDocument; if (!doc || !doc.documentElement) return;
  const [bg, fg, link] = THEMES[theme];
  let st = doc.getElementById("nomad-style");
  if (!st) { st = doc.createElementNS("http://www.w3.org/1999/xhtml", "style"); st.id = "nomad-style";
             (doc.head || doc.documentElement).appendChild(st); }
  st.textContent = `html{background:${bg} !important;font-size:${size}% !important}
    body{background:${bg} !important;color:${fg} !important;max-width:44rem;margin:0 auto !important;padding:1.2rem 1.2rem 4rem !important;line-height:1.6}
    body *{color:inherit !important;background-color:transparent !important}
    a,a *{color:${link} !important} img,svg{max-width:100% !important;height:auto !important}`;
  $("page").style.background = bg;
}
$("page").addEventListener("load", () => {
  let path = "";
  try { path = decodeURIComponent($("page").contentWindow.location.pathname); } catch (e) { return; }
  const here = path.startsWith(decodeURIComponent(base)) ? path.slice(decodeURIComponent(base).length) : null;
  const found = spine.findIndex(s => s.href === here);     // also follows links clicked inside the book
  if (found >= 0) idx = found;
  $("chap").value = idx; $("prev").disabled = idx === 0; $("next").disabled = idx === spine.length - 1;
  store.set("reader.pos." + book, idx);
  restyle();
  try { $("page").contentDocument.addEventListener("keydown", keys); } catch (e) {}
});
function keys(e) { if (e.key === "ArrowRight") go(idx + 1); else if (e.key === "ArrowLeft") go(idx - 1); }
document.addEventListener("keydown", keys);
$("prev").onclick = () => go(idx - 1);
$("next").onclick = () => go(idx + 1);
$("chap").onchange = () => go(+$("chap").value);
$("bigger").onclick = () => { size = Math.min(220, size + 10); store.set("reader.size", size); restyle(); };
$("smaller").onclick = () => { size = Math.max(70, size - 10); store.set("reader.size", size); restyle(); };
$("theme").onclick = () => { const k = Object.keys(THEMES); theme = k[(k.indexOf(theme) + 1) % k.length]; store.set("reader.theme", theme); restyle(); };

(async () => {
  try {
    const r = await fetch("/api/books/info?file=" + encodeURIComponent(book));
    const d = await r.json(); if (!r.ok || d.error) throw new Error(d.error || r.statusText);
    spine = d.spine; document.title = d.title + " - Pi-Nomad"; $("title").textContent = d.title;
    $("chap").replaceChildren(...spine.map((s, i) => new Option(s.title || "Section " + (i + 1), i)));
    go(store.get("reader.pos." + book, 0));
  } catch (e) {
    $("page").style.display = "none"; $("msg").style.display = "block";
    $("msg").textContent = "Could not open this book: " + e.message;
  }
})();
</script>
</body></html>
