<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maps - Pi-Nomad</title>
<meta name="theme-color" content="#141c2d">
<link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/maps/lib/maplibre-gl.css">
<style>
  html, body { height:100%; }
  #bar { position:absolute; z-index:5; top:10px; left:10px; max-width:calc(100vw - 20px); display:flex; flex-wrap:wrap; gap:.4rem .75rem; align-items:center; background:rgba(20,28,45,.94); border:1px solid var(--line); border-radius:12px; padding:.4rem .7rem .4rem .5rem; }
  #bar a { text-decoration:none; font-size:.94rem; }
  #bar a.home { display:flex; align-items:center; gap:.4rem; font-family:var(--display); font-size:1.08rem; font-weight:700; color:var(--teal); }
  #bar a.home b { color:var(--amber); font-weight:700; }
  #bar a.home img { width:38px; height:auto; }
  #bar select { min-height:38px; padding:.25rem .5rem; flex:0 1 auto; min-width:0; }
  #find { display:flex; gap:.35rem; flex:1 1 13rem; min-width:0; position:relative; }
  #find input { flex:1; min-width:0; min-height:38px; padding:.25rem .6rem; }
  #find button { min-height:38px; padding:.25rem .7rem; }
  #hits { position:absolute; top:calc(100% + .5rem); left:0; right:0; max-height:min(60vh, 26rem); overflow:auto; margin:0; padding:.3rem;
          list-style:none; background:rgba(20,28,45,.97); border:1px solid var(--line); border-radius:12px; }
  #hits:empty { display:none; }
  #hits li { padding:.5rem .6rem; border-radius:8px; cursor:pointer; }
  #hits li:hover, #hits li.on { background:var(--panel-2); }
  #hits b { display:block; font-weight:600; overflow-wrap:anywhere; }
  #hits small { color:var(--mut); }
  #hits li.note { cursor:default; color:var(--mut); } #hits li.note:hover { background:none; }
  #map { position:absolute; inset:0; }
  #empty { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  #empty h2 { font-size:1.6rem; margin:0 0 .4rem; }
</style></head>
<body>
<div id="bar"><a class="home" href="/" title="Back to the dashboard"><img src="/img/mark.png" alt="" width="192" height="145"><span>Pi-<b>Nomad</b></span></a><select id="file" aria-label="Map region"></select>
  <form id="find" role="search"><input id="q" type="search" placeholder="Find a town, street or place" aria-label="Find a town, street or place" autocomplete="off" maxlength="80"><button>Find</button><ul id="hits"></ul></form>
  <a href="/maps/manage.html">Manage regions</a></div>
<div id="map"></div>
<div id="empty"><div><h2>No offline maps yet</h2><p class="mut">Download a region (for example Michigan) while you have internet.</p>
  <p><a href="/maps/manage.html">Open the map region manager</a></p></div></div>
<script src="/maps/lib/maplibre-gl.js"></script>
<script src="/maps/lib/pmtiles.js"></script>
<script src="/maps/lib/basemaps.js"></script>
<script>
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);
let map, pin, hits = [];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function show(file) {
  const url = location.origin + "/maps-data/" + encodeURIComponent(file);
  const p = new pmtiles.PMTiles(url);
  protocol.add(p);
  const h = await p.getHeader();
  if (map) map.remove();
  map = new maplibregl.Map({
    container: "map",
    // Fonts and icons are served from this device, so labels work with no internet.
    style: {
      version: 8,
      glyphs: location.origin + "/maps/assets/fonts/{fontstack}/{range}.pbf",
      sprite: location.origin + "/maps/assets/sprites/v4/light",
      sources: { protomaps: { type: "vector", url: "pmtiles://" + url, maxzoom: h.maxZoom,
                              attribution: '<a href="https://protomaps.com">Protomaps</a> © <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>' } },
      layers: basemaps.layers("protomaps", basemaps.namedFlavor("light"), { lang: "en" }),
    },
    bounds: [[h.minLon, h.minLat], [h.maxLon, h.maxLat]],
    fitBoundsOptions: { animate: false },
    maxBounds: [[h.minLon - 1, h.minLat - 1], [h.maxLon + 1, h.maxLat + 1]],
  });
  map.addControl(new maplibregl.NavigationControl(), "bottom-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "imperial" }), "bottom-left");
  localStorageSafe("set", file);
  pin = null; hits = []; document.getElementById("hits").innerHTML = ""; document.getElementById("q").value = "";
}

// ----- place search: names come from the map file itself, so this works with no internet -----
async function find() {
  const box = document.getElementById("hits"), q = document.getElementById("q").value.trim();
  if (q.length < 2 || !map) { box.innerHTML = ""; return; }
  const c = map.getCenter();
  const file = document.getElementById("file").value;
  box.innerHTML = '<li class="note">Searching\u2026</li>';
  let r;
  try {
    const res = await fetch(`/api/maps/search?file=${encodeURIComponent(file)}&q=${encodeURIComponent(q)}&lon=${c.lng.toFixed(5)}&lat=${c.lat.toFixed(5)}`);
    r = await res.json();
    if (!res.ok || r.error) throw new Error(r.error || res.statusText);
  } catch (e) { box.innerHTML = `<li class="note">${esc(e.message)}</li>`; return; }
  if (!r.ready) { box.innerHTML = '<li class="note">The place names for this map are still being read. Try again in a minute or two.</li>'; return; }
  hits = r.results;
  box.innerHTML = hits.length ? hits.map((h, i) => `<li data-i="${i}"><b>${esc(h.name)}</b><small>${esc(h.kind)}${h.near ? " \u00b7 near " + esc(h.near) : ""}</small></li>`).join("")
    : '<li class="note">Nothing by that name on this map.</li>';
  if (hits.length === 1) go(0);
}
function go(i) {
  const h = hits[i]; if (!h) return;
  if (pin) pin.remove();
  pin = new maplibregl.Marker({ color: "#eaa640" }).setLngLat([h.lon, h.lat]).addTo(map);
  map.flyTo({ center: [h.lon, h.lat], zoom: Math.max(map.getZoom(), h.zoom), essential: true });
  document.getElementById("hits").innerHTML = "";
  document.getElementById("q").blur();
}
document.getElementById("find").onsubmit = e => { e.preventDefault(); find(); };
document.getElementById("hits").onclick = e => { const li = e.target.closest("li[data-i]"); if (li) go(+li.dataset.i); };
document.getElementById("q").addEventListener("search", () => { if (!document.getElementById("q").value) document.getElementById("hits").innerHTML = ""; });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("hits").innerHTML = ""; });

function localStorageSafe(op, v) {   // remembering the last map is a nicety; never fail on it
  try { return op === "set" ? localStorage.setItem("lastMap", v) : localStorage.getItem("lastMap"); } catch (e) { return null; }
}

(async () => {
  const files = await (await fetch("/api/maps/list")).json();
  if (!files.length) { document.getElementById("empty").style.display = "flex"; document.getElementById("map").style.display = "none"; return; }
  const sel = document.getElementById("file");
  sel.replaceChildren(...files.map(f => new Option(f.name.replace(/\.pmtiles$/, ""), f.name)));
  const last = localStorageSafe("get");
  if (files.some(f => f.name === last)) sel.value = last;
  sel.onchange = () => show(sel.value);
  show(sel.value);
})();
</script>
</body></html>
